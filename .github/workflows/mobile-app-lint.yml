name: Mobile App Lint

on:
  push:
    paths:
      - "mobile_app/**"
      - ".github/workflows/mobile-app-lint.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - "mobile_app/**"
      - ".github/workflows/mobile-app-lint.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

jobs:
  mobile-app-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        # From the repo root: pnpm 10 started inside mobile_app applies its
        # pnpm.overrides to the whole workspace and then rejects every other
        # project's lockfile (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH). Vercel
        # installs from the root too.
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile --filter ./mobile_app

      - name: Run lint
        run: pnpm lint
