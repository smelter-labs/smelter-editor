name: Redeploy staging

# Redeploy the latest already-built `staging` image without rebuilding.
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          envs: TWITCH_CLIENT_ID,TWITCH_CLIENT_SECRET,KICK_CLIENT_ID,KICK_CLIENT_SECRET,SMELTER_SERVER_LOGGER_LEVEL,SMELTER_DEMO_ROUTER_LOGGER_LEVEL,SMELTER_LOGGER_LEVEL
          script: |
            set -euo pipefail
            cd ~/smelter-editor
            docker compose -f compose.staging.yaml pull
            docker compose -f compose.staging.yaml up -d --remove-orphans --force-recreate
            docker image prune -f
        env:
          # Stream provider credentials (GitHub Actions secrets).
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          # Plain-text logger config — edit here to tune staging log levels.
          # Picked up by compose interpolation in compose.staging.yaml.
          SMELTER_SERVER_LOGGER_LEVEL: "debug,smelter_core=info,naga=info,cosmic_text=info,wgpu_hal=warn,smelter_core::pipeline::instance=warn"
          SMELTER_DEMO_ROUTER_LOGGER_LEVEL: "warn"
          SMELTER_LOGGER_LEVEL: "info"
