# Workshop reverse-SSH tunnel — paste into the puffer.fishjam.io server block
# on the GPU box and `nginx -s reload`. Forwards the workshop path to the
# presenter's laptop (Caddy :8080 tunneled to :18080 by dev/tunnel-ssh.sh).
# The trailing slash on proxy_pass strips the path prefix, so the laptop sees
# clean /room, /whep, /mobile paths.
location /smelter-editor-workshop/ {
    proxy_pass http://127.0.0.1:18080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Keep long-lived WebSockets (game input) and WHEP sessions alive.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
